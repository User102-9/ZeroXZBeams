<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Section</title>
    <style>
        /* Base Styling & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Public Info Top Bar */
        .top-bar {
            background-color: #111827;
            text-align: center;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 2px solid #1f2937;
            color: #f3f4f6;
        }

        .heart-emoji {
            color: #ef4444;
            display: inline-block;
            margin-left: 5px;
            animation: pulse 1.5s infinite;
        }

        /* Main Workspace Grid */
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
        }

        /* Left Control Panel / Sidebar */
        .sidebar {
            background-color: #111827;
            border-right: 1px solid #1f2937;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: #1f2937;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #374151;
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: #9ca3af;
        }

        .card p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d1d5db;
        }

        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #4f46e5;
        }

        /* Main Showcase Area */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
        }

        .admin-header {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #a3e635, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        /* Center Art / Glow Element */
        .art-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            height: 400px;
        }

        .glow-line-pink {
            position: absolute;
            width: 400px;
            height: 30px;
            background: linear-gradient(90deg, #ec4899, #db2777);
            transform: rotate(-45deg);
            filter: blur(10px);
            border-radius: 50px;
            opacity: 0.8;
        }

        .display-text {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .display-text h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ec4899;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            margin-bottom: 10px;
        }

        .display-text p {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 6px;
            color: #94a3b8;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Responsive Layout fixes */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid #1f2937;
            }
        }
    </style>
</head>
<body>

    <!-- Public Info Top Bar -->
    <div class="top-bar">
        PUBLIC INFO: Hamid Abdu Abdulla <span class="heart-emoji">❤️</span>
    </div>

    <!-- Main Workspace Container -->
    <div class="container">
        
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="card">
                <h3>System Logs</h3>
                <p>Done — tap anywhere to arm it, then after 10s the picture zooms in and the drops occur.</p>
            </div>
            
            <div class="card">
                <h3>Credentials</h3>
                <p>Scroll down for the Admin Section — password required to unlock treatment modes.</p>
            </div>

            <button class="btn">Upgrade Now</button>
        </aside>

        <!-- Main Graphic Dashboard Elements -->
        <main class="main-content">
            <div class="admin-header">Admin Section</div>
            
            <div class="art-wrapper">
                <!-- Pink Neon Accent Line -->
                <div class="glow-line-pink"></div>
                
                <!-- Front Text Overlay -->
                <div class="display-text">
                    <h1>ABDU</h1>
                    <p>YARA - YARA - YARA</p>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
