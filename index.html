<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus X Beamz</title>
<meta name="description" content="Nexus X Beamz - Roblox tools, generators and link utilities." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d0b1a; --fg:#fafafa; --card:#1a1730; --card-2:#221d3d;
    --muted:#8a85a8; --border:#2b2547; --accent:#a78bfa;
    --glow: 0 0 30px rgba(255,255,255,.25), 0 0 60px rgba(167,139,250,.35);
    --glow-soft: 0 0 20px rgba(255,255,255,.15);
    --dot: rgba(70,60,110,.45);
    --font-display:"Orbitron","Rajdhani",system-ui,sans-serif;
    --font-sans:"Rajdhani",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}
  html,body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);min-height:100%}
  body{
    background-image:
      radial-gradient(circle, var(--dot) 1px, transparent 1px),
      radial-gradient(ellipse at top, rgba(80,60,140,.35), transparent 60%);
    background-size:28px 28px,100% 100%;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:.05em}
  .text-glow{text-shadow:var(--glow)}
  .shadow-glow{box-shadow:var(--glow-soft)}
  .container{max-width:1100px;margin:0 auto;padding:0 1.5rem}

  /* Nav */
  nav.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding:1.5rem}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;
    border:1px solid var(--border);background:rgba(26,23,48,.8);
    padding:.65rem 1.25rem;border-radius:.6rem;
    font-family:var(--font-display);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;
    backdrop-filter:blur(8px);cursor:pointer;color:var(--fg);
    transition:.2s;
  }
  .btn:hover{background:var(--card-2);box-shadow:var(--glow-soft)}
  .btn.primary{background:var(--fg);color:#111;border-color:var(--fg)}
  .btn.primary:hover{opacity:.9}

  /* Hero */
  header.hero{text-align:center;padding:3rem 1.5rem}
  header.hero h1{font-size:clamp(2.2rem,6vw,4rem);text-transform:uppercase;letter-spacing:.25em}

  /* Sections */
  section{padding:2rem 1.5rem 3rem}
  section h2{text-align:center;font-size:clamp(1.6rem,3vw,2.2rem);text-transform:uppercase;letter-spacing:.3em;margin-bottom:2.5rem}

  /* Cards */
  .grid{display:grid;gap:1.25rem;max-width:1000px;margin:0 auto}
  .grid.cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{
    border:1px solid var(--border);background:rgba(26,23,48,.6);
    border-radius:1rem;padding:2rem;text-align:center;
    display:flex;flex-direction:column;gap:1.25rem;align-items:center;justify-content:space-between;
    backdrop-filter:blur(8px);transition:.25s;
  }
  .card:hover{border-color:rgba(167,139,250,.6);box-shadow:var(--glow-soft);transform:translateY(-2px)}
  .card h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.2em}
  .card p{color:var(--muted);font-size:.95rem}
  .pill{
    display:inline-flex;padding:.55rem 1.25rem;border-radius:.5rem;
    background:var(--card-2);font-family:var(--font-display);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
    transition:.2s;
  }
  .card:not(.disabled):hover .pill{background:var(--fg);color:#111}
  .card.disabled{opacity:.65;cursor:not-allowed}
  .card.disabled .pill{background:var(--card-2);color:var(--muted)}

  /* Linkhider grid */
  .grid.links{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-width:1200px}
  .link{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--border);background:rgba(26,23,48,.6);
    padding:1rem 1.25rem;border-radius:.75rem;font-weight:600;
    backdrop-filter:blur(8px);transition:.2s;
  }
  .link:hover{border-color:rgba(167,139,250,.6);box-shadow:var(--glow-soft)}
  .badge{background:var(--card-2);padding:.25rem .65rem;border-radius:.35rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}

  /* Hyperlink */
  .panel{max-width:640px;margin:0 auto;border:1px solid var(--border);background:rgba(26,23,48,.6);border-radius:1rem;padding:2rem;backdrop-filter:blur(8px)}
  .panel label{display:block;text-align:center;font-family:var(--font-display);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.75rem}
  .panel input{width:100%;padding:.85rem 1rem;border:1px solid var(--border);background:rgba(34,29,61,.6);color:var(--fg);border-radius:.55rem;font:inherit;outline:none}
  .panel input:focus{border-color:var(--accent)}
  .result{min-height:3rem;text-align:center;padding:.85rem 1rem;border:1px solid var(--border);background:rgba(34,29,61,.6);border-radius:.55rem;word-break:break-all;font-size:.9rem}
  .result a{text-decoration:underline}
  .err{color:#ff6b6b}
  .muted{color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem}
  .full{width:100%;justify-content:center}

  footer{text-align:center;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;padding:2.5rem 1rem}

  .hidden{display:none}
  .center{text-align:center}
  .sub{margin-top:.75rem;font-family:var(--font-display);font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>

<!-- ============= HOME ============= -->
<div id="page-home">
  <nav class="top">
    <a class="btn" href="#/linkhider">🔗 Link Hider</a>
    <a class="btn" style="margin-left:auto" href="https://discord.gg/cCj5n9ZN" target="_blank" rel="noreferrer">💬 Discord Server</a>
  </nav>

  <header class="hero">
    <h1 class="text-glow">Nexus X Beamz</h1>
  </header>

  <section>
    <h2 class="text-glow">Generators</h2>
    <div class="grid cards" id="generators"></div>
  </section>

  <section>
    <h2 class="text-glow">Tools</h2>
    <div class="grid cards" id="tools"></div>
  </section>

  <footer>© Nexus X Beamz</footer>
</div>

<!-- ============= LINK HIDER ============= -->
<div id="page-linkhider" class="hidden">
  <div style="padding:1.5rem"><a class="btn" href="#/">← Back</a></div>
  <header class="hero">
    <h1 class="text-glow">Link Hider</h1>
    <p class="sub">Hyperlink Site</p>
  </header>
  <section>
    <div class="grid links" id="link-list"></div>
  </section>
</div>

<!-- ============= HYPERLINK ============= -->
<div id="page-hyperlink" class="hidden">
  <div style="padding:1.5rem"><a class="btn" href="#/">← Back</a></div>
  <header class="hero">
    <h1 class="text-glow">Hyperlink</h1>
    <p class="sub">Discord Hyperlink Generator</p>
  </header>
  <section>
    <div class="panel">
      <label>Phishing Link (Destination)</label>
      <input id="hl-input" type="text" placeholder="e.g. pr.com" />
      <div class="stack">
        <div>
          <label>Result</label>
          <div class="result" id="hl-result"><span class="muted">Press generate to create your link</span></div>
        </div>
        <button class="btn primary full" id="hl-gen">Generate</button>
        <button class="btn full" id="hl-copy" disabled style="opacity:.5">📋 Copy</button>
      </div>
    </div>
  </section>
</div>

<script>
  // Data
  const generators = [
    { title:"#1 Immortal", desc:"Trustworthy Collection of powerful Roblox Websites.", href:"https://immortal.st/?code=Nzc0MTk5OTE3MjA4NzEzNDIwNw=" },
    { title:"#2 Shockify", desc:"Trustworthy Collection of powerful Roblox Websites.", href:"https://shockify.st/?code=Nzc0MTk5OTE3MjA4NzEzNDIwNw==" },
    { title:"#3 Splunk",   desc:"Trustworthy Collection of powerful Roblox Websites.", href:"https://app.beamers.si/u/shockifyxsplunk" },
    { title:"#4 Injuries (Updating)", desc:"Trustworthy Collection of powerful Roblox Websites.", disabled:true },
  ];
  const tools = [
    { title:"Bypasser", desc:"OP Tool Commonly Used to Remove the account Gmail", href:"https://rblxbypasser.com" },
    { title:"Hyperlink", desc:"Hyperlink used to hide your dangerous link on discord", hash:"#/hyperlink" },
  ];
  const sites = [
    { name:"shorturl.asia", url:"https://www.shorturl.asia/", recommended:true },
    { name:"is.gd", url:"https://is.gd/" },
    { name:"TinyURL", url:"https://tinyurl.com/" },
    { name:"Bit.ly", url:"https://bitly.com/" },
    { name:"Rebrand.ly", url:"https://rebrandly.com/" },
    { name:"Cutt.ly", url:"https://cutt.ly/" },
    { name:"click.ly", url:"https://click.ly/" },
    { name:"tiny.cc", url:"https://tiny.cc/" },
    { name:"shorter.me", url:"https://shorter.me/" },
    { name:"shorter.gg", url:"https://shorter.gg/" },
    { name:"spoo.me", url:"https://spoo.me/" },
    { name:"reurl.cc", url:"https://reurl.cc/" },
    { name:"href.li", url:"https://href.li/" },
    { name:"rb.gy", url:"https://rb.gy/" },
    { name:"t2m.io", url:"https://t2m.io/" },
    { name:"clck.ru", url:"https://clck.ru/" },
    { name:"v.gd", url:"https://v.gd/" },
    { name:"short.io", url:"https://short.io/" },
    { name:"kurze.space", url:"https://kurze.space/" },
  ];

  // Render cards
  function cardHTML(c){
    const inner = `
      <div class="card${c.disabled?' disabled':''}">
        <h3>${c.title}</h3>
        <p>${c.desc}</p>
        <span class="pill">${c.disabled?'Updating':'Go to Site'}</span>
      </div>`;
    if(c.disabled) return `<div>${inner}</div>`;
    const href = c.hash || c.href;
    const target = c.hash ? '' : 'target="_blank" rel="noreferrer"';
    return `<a href="${href}" ${target}>${inner}</a>`;
  }
  document.getElementById('generators').innerHTML = generators.map(cardHTML).join('');
  document.getElementById('tools').innerHTML = tools.map(cardHTML).join('');
  document.getElementById('link-list').innerHTML = sites.map(s => `
    <a class="link" href="${s.url}" target="_blank" rel="noreferrer">
      <span>${s.name}</span>
      ${s.recommended?'<span class="badge">Recommended</span>':''}
    </a>
  `).join('');

  // Router (hash-based)
  const pages = { '': 'page-home', '/': 'page-home', '/linkhider':'page-linkhider', '/hyperlink':'page-hyperlink' };
  function route(){
    const h = location.hash.replace(/^#/,'') || '/';
    const id = pages[h] || 'page-home';
    ['page-home','page-linkhider','page-hyperlink'].forEach(p=>{
      document.getElementById(p).classList.toggle('hidden', p!==id);
    });
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  route();

  // Hyperlink shortener
  async function shorten(url){
    const endpoints = [
      `https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`,
      `https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`,
    ];
    let lastErr;
    for (const ep of endpoints){
      try{
        const r = await fetch(ep);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const text = (await r.text()).trim();
        if(text.startsWith('http')) return text;
        throw new Error(text || 'Bad response');
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('Failed to shorten');
  }

  const $in = document.getElementById('hl-input');
  const $res = document.getElementById('hl-result');
  const $gen = document.getElementById('hl-gen');
  const $copy = document.getElementById('hl-copy');
  let current = '';

  $gen.addEventListener('click', async ()=>{
    let url = $in.value.trim();
    $res.innerHTML = '';
    if(!url){ $res.innerHTML = '<span class="err">Enter a URL</span>'; return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://'+url;
    try{ new URL(url); }catch{ $res.innerHTML = '<span class="err">Invalid URL</span>'; return; }
    $gen.disabled = true; $gen.textContent = 'Generating...';
    try{
      const short = await shorten(url);
      current = short;
      $res.innerHTML = `<a href="${short}" target="_blank" rel="noreferrer">${short}</a>`;
      $copy.disabled = false; $copy.style.opacity = 1;
    }catch(e){
      $res.innerHTML = `<span class="err">${(e&&e.message)||'Failed'}</span>`;
    }finally{
      $gen.disabled = false; $gen.textContent = 'Generate';
    }
  });

  $copy.addEventListener('click', async ()=>{
    if(!current) return;
    await navigator.clipboard.writeText(current);
    const t = $copy.textContent;
    $copy.textContent = '✓ Copied';
    setTimeout(()=>$copy.textContent = t, 1500);
  });
</script>
</body>
</html>
